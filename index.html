<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Njuguna Njenga, senior AI engineer and technical architect</title>
    <meta
      name="description"
      content="Njuguna Njenga designs AI systems that replace the ones people work around. Senior AI engineer and technical architect in Nairobi, currently an AWS ProServe consultant on UN World Food Programme supply-chain systems."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Njuguna Njenga, senior AI engineer and technical architect" />
    <meta
      property="og:description"
      content="AI systems that replace the ones people work around. See the systems, drawn out part by part."
    />
    <meta name="theme-color" content="#e4eaee" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b2545" media="(prefers-color-scheme: dark)" />
    <script>
      // Set the theme before first paint: saved choice first, then the system setting.
      (function () {
        var saved = null
        try {
          saved = localStorage.getItem('theme')
        } catch (e) {}
        var dark = saved ? saved === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
